[package]
name = "aranya-policy-lang"
description = "The Aranya Policy Language parser"
version = "0.17.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lints]
workspace = true


[lib]
bench = false


[[bin]]
name = "parser-explorer"
bench = false


[[test]]
name = "snap"
harness = false
bench = false


[features]
default = []


[dependencies]
buggy = { workspace = true, features = ["std"] }
# `std` is required because bin/parser-explorer uses `clap` which
# requires it for arg parsing.
aranya-policy-ast = { version = "0.16.0", path = "../aranya-policy-ast", features = ["std"] }

annotate-snippets = { workspace = true }
anyhow = { workspace = true }
chumsky = { workspace = true, features = ["pratt"] }
clap = { workspace = true, features = ["derive"] }
logos = { workspace = true, features = ["export_derive"] }
markdown = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true, features = ["deserialize"] }


[dev-dependencies]
snapbox = { workspace = true }
tryfn = { workspace = true }


[package.metadata.docs.rs]
all-features = true
