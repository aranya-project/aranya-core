[package]
name = "aranya-policy-lang"
description = "The Aranya Policy Language parser"
version = "0.17.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
bench = false

[[bin]]
name = "parser-explorer"
bench = false

[features]
default = []

[dependencies]
buggy = { workspace = true, features = ["std"] }
# `std` is required because bin/parser-explorer uses `clap` which
# requires it for arg parsing.
aranya-policy-ast = { version = "0.16.0", path = "../aranya-policy-ast", features = ["std"] }

annotate-snippets = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
markdown = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }
tracing = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
rstest = { workspace = true }


[package.metadata.docs.rs]
all-features = true
