[package]
name = "aranya-policy-module"
description = "The Aranya Policy module format"
version = "0.23.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
bench = false

[dependencies]
aranya-policy-ast = { version = "0.16.0", path = "../aranya-policy-ast" }

fnv = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
postcard = { workspace = true, features = ["alloc"] }
rkyv = { workspace = true, features = ["alloc", "indexmap-2"] }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }
zrip = { workspace = true, features = ["alloc", "paranoid"] }

[features]
default = []

# Enable `std`.
std = [
	"aranya-policy-ast/std",
	"serde/std",
	"thiserror/std",
]

testing = []

[package.metadata.docs.rs]
all-features = true
