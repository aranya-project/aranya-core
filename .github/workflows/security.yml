name: "Security Checks"

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string

permissions:
  contents: read

env:
  REV: ${{ github.run_id }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.workflow }}
  cancel-in-progress: true

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install cargo-audit
        uses: aranya-project/install-action@main
        with:
          tool: cargo-audit@0.22.0

      - name: Install cargo-deny
        uses: aranya-project/install-action@main
        with:
          tool: cargo-deny@0.18.9

      - name: Install cargo-vet
        uses: aranya-project/install-action@main
        with:
          tool: cargo-vet@0.10.2

      - name: Run cargo security checks
        run: cargo make security
