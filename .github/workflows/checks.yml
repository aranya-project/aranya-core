name: "PR Checks"

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string

permissions:
  contents: read

env:
  REV: ${{ github.run_id }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.workflow }}
  cancel-in-progress: true


jobs:
  first:
    runs-on: ubuntu-slim
    steps:
      - run: exit 0

  second:
    runs-on: ubuntu-slim
    steps:
      - run: exit 1

  # ==== Failure alert ====

  failure-alert:
    if: always()
    runs-on: ubuntu-slim

    needs:
      - first
      - second

    steps:
      - if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
        run: |
          echo "Some workflows have failed!"
          exit 1
