name: "Unit tests"

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string

permissions:
  contents: read

env:
  REV: ${{ github.run_id }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.workflow }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu2404-arm64-4core
        chunk:
          - 1
          - 2
          - 3
          - 4
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Install cargo-all-features
        uses: aranya-project/install-action@main
        with:
          tool: cargo-all-features@1.12.0

      - name: Unit Tests
        run: cargo make unit-tests --n-chunks 4 --chunk "${{ matrix.chunk }}"

  core-example:
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu2404-arm64-4core
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run aranya-core example
        run: cargo make run-aranya-core-example

  test-benchmarks:
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu2404-arm64-4core
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Test benchmarks (not valid measurements)
        run: cargo make test-benchmarks

  tests-pass:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - core-example
      - test-benchmarks
    steps:
      - name: Tests passed
        run: echo 'Tests passed'
