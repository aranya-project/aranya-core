name: Check aranya-embedded

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string

permissions:
  contents: read

env:
  REV: ${{ github.run_id }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.workflow }}
  cancel-in-progress: true

jobs:
  # This job will pass even when the build step fails.
  embedded-build:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout aranya-embedded repo
        uses: actions/checkout@v7
        with:
            repository: aranya-project/aranya-embedded
            path: aranya-embedded

      # Refer to https://github.com/aranya-project/aranya-embedded/blob/main/crates/chat-app/TUTORIAL.md for installation and build instructions.
      - name: Install espup
        uses: aranya-project/install-action@main
        with:
          tool: espup@0.16.0

      - name: Install esp toolchain
        run: espup install

      - name: Point aranya-embedded to local aranya crate deps
        run: |
            mkdir -p $GITHUB_WORKSPACE/aranya-embedded/.cargo
            echo "paths = [\"$GITHUB_WORKSPACE\"]" > $GITHUB_WORKSPACE/aranya-embedded/.cargo/config.toml

      - id: build
        name: Build chat-app crate in aranya-embedded repo
        continue-on-error: true
        run: |
            . /home/runner/export-esp.sh
            cd aranya-embedded/crates/chat-app
            cargo check

  # This job will succeeed if embedded check succeeded or will be skipped if it failed.
  # This lets us see that status without getting a big red X that hides actual important failures.
  embedded-skipped-if-failed:
    runs-on: ubuntu-latest
    needs: embedded-build
    if: ${{ needs.embedded-build.outputs.outcome == 'success' }}
    steps:
      - run: echo 'Embedded build succeeded!'
