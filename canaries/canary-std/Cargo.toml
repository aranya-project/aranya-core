[workspace]

[package]
name = "canary-std"
publish = false
edition = "2024"

[dependencies]
# aranya-afc-util = { path = "../../crates/aranya-afc-util" }
aranya-core = { path = "../../crates/aranya-core", default-features = false, features = [
	"custom-engine",
	"memstore",
] }
# `aranya-crypto` enables `getrandom` by default.
aranya-crypto = { path = "../../crates/aranya-crypto", default-features = false, features = [
	"alloc",
	"committing-aead",
	"clone-aead",
	"proptest",
	"rand_compat",
] }
aranya-device-ffi = { path = "../../crates/aranya-device-ffi" }
# aranya-fast-channels = { path = "../../crates/aranya-fast-channels" }
aranya-id = { path = "../../crates/aranya-id" }
aranya-idam-ffi = { path = "../../crates/aranya-idam-ffi" }
# aranya-libc = { path = "../../crates/aranya-libc" }
aranya-perspective-ffi = { path = "../../crates/aranya-perspective-ffi" }
aranya-policy-ast = { path = "../../crates/aranya-policy-ast" }
aranya-policy-ifgen = { path = "../../crates/aranya-policy-ifgen" }
aranya-policy-module = { path = "../../crates/aranya-policy-module" }
aranya-policy-text = { path = "../../crates/aranya-policy-text" }
aranya-policy-vm = { path = "../../crates/aranya-policy-vm", features = ["derive"] }
# These features must also be no-std.
aranya-runtime = { path = "../../crates/aranya-runtime", features = ["testing"] }
